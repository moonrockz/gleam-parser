[package]
name = "gleam-ast-oracle"
version = "0.1.0"
edition = "2024"
publish = false
description = "Writes gleam-parser's canonical AST JSON from the Gleam compiler's parser (the parity oracle)"

[dependencies]
gleam-core = { git = "https://github.com/gleam-lang/gleam.git", tag = "v1.19.2" }
src-span = { git = "https://github.com/gleam-lang/gleam.git", tag = "v1.19.2" }
camino = "1"
serde_json = "1"
ecow = "0.3.1"
unicode-width = "=0.2.2"

[profile.release]
debug = false
