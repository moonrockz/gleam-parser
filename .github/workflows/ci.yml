name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned MoonBit toolchain (moon/moonc/core). Bump deliberately; see AGENTS.md.
  MOONBIT_VERSION: "0.10.15+943464bfa"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Check formatting
        run: |
          moon fmt
          moon fmt scripts/*.mbtx
          git diff --exit-code -- '*.mbt' '*.mbtx' || (echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit" && exit 1)

      - name: Check code
        run: moon check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Run unit tests
        run: mise run test:unit

      - name: Run BDD features
        run: mise run test:bdd

      - name: Run script tests
        run: mise run test:scripts

      - name: Run cookbook tests
        run: mise run test:docs

      - name: Verify core-only packaging
        run: mise run test:profile-package

      - name: Verify independently packaged Morphir module
        env:
          GLEAM_PUBLISH_MODULE_DIR: profiles/morphir
          GLEAM_PUBLISH_TAG_PREFIX: morphir-v
          GLEAM_PUBLISH_CHECK_ONLY: "true"
        run: mise run release:profile

      - name: Check rejection parity
        run: mise run test:rejection

      - name: Upload rejection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejection-report
          path: _build/reports/rejection
          if-no-files-found: ignore

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Test the library on every supported target
        run: mise run test:targets

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Calculate coverage (warn on push, gate on PR)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mise run coverage:ci-gate
          else
            mise run coverage:ci-warn
          fi

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Cache the parity corpus
        uses: actions/cache@v4
        with:
          path: .corpus
          key: gleam-parity-corpus-${{ hashFiles('tests/corpus/manifest.json') }}

      - name: Fetch and verify the corpus
        run: mise run corpus:fetch

      - name: Score Gleam parity
        run: mise run test:parity

      - name: Score format parity
        run: mise run test:format

      - name: Add the format summary to the job summary
        if: always()
        run: |
          if [ -f _build/reports/format/summary.md ]; then
            cat _build/reports/format/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload format report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-report
          path: _build/reports/format
          if-no-files-found: ignore

      - name: Add the summary to the job summary
        if: always()
        run: |
          if [ -f _build/reports/parity/summary.md ]; then
            cat _build/reports/parity/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: _build/reports/parity
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - unit-tests
      - targets
      - coverage
      - parity
    steps:
      - name: Check that every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Some CI jobs did not pass"
            echo "$failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
