name: Release Morphir profile

# Run after the required core version is published. The module and its release
# identity are independent; repeated publication of the same version is skipped.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-morphir
  cancel-in-progress: false

env:
  MOONBIT_VERSION: "0.10.15+943464bfa"
  GLEAM_PUBLISH_MODULE_DIR: profiles/morphir
  GLEAM_PUBLISH_TAG_PREFIX: morphir-v

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: moon update
      - name: Validate the profile and README examples
        run: moon test profiles/morphir/src
      - name: Set up credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}
        run: mise run release:credentials
      - name: Publish the optional module
        run: mise run release:profile
